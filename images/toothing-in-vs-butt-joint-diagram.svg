    <text x="0" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#1b2430">New work stops dead against the old. One straight joint runs the</text>
    <text x="0" y="384" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#1b2430">full height, and the eye follows it from across the street.</text>
