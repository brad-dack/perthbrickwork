    <text x="0" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" fill="#1b2430">Alternate bricks are cut out of the</text>
    <text x="0" y="401" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" fill="#1b2430">old wall so the new work bonds into</text>
    <text x="0" y="426" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" fill="#1b2430">it. No continuous joint for the eye to</text>
    <text x="0" y="451" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" fill="#1b2430">follow.</text>
