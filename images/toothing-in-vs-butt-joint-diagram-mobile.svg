    <text x="0" y="376" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" fill="#1b2430">New work stops dead against the old.</text>
    <text x="0" y="401" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" fill="#1b2430">One straight joint runs the full</text>
    <text x="0" y="426" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" fill="#1b2430">height, and the eye follows it from</text>
    <text x="0" y="451" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" fill="#1b2430">across the street.</text>
  </g>

