  <rect width="480" height="1072" fill="#ffffff"/>
  <text x="20" y="34" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#55606e">How new brickwork meets old - diagrams,</text>

  <text x="20" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#55606e">not photographs</text>

  <g transform="translate(20,90)">
    <text x="0" y="22" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="24" font-weight="700" fill="#1b2430">1. Butted against it</text>
    <rect x="0" y="34" width="221" height="30" rx="15" fill="#fceae4" stroke="#f0c9bc" stroke-width="1"/>
    <text x="110" y="55" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="600" fill="#96331a">The join stays visible</text>
